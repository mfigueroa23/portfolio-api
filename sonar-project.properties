# SonarQube Cloud analysis, run by the Security workflow (.github/workflows/security.yaml).
sonar.organization=w0rkspace
sonar.projectKey=w0rkspace_portfolio-api
sonar.projectName=portfolio-api

# Unit tests live next to the code (src/**/*.spec.ts) and e2e tests in test/.
sonar.sources=src
sonar.tests=src,test
sonar.exclusions=src/generated/**,**/*.spec.ts
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The scan fails when the Quality Gate does not pass.
sonar.qualitygate.wait=true
